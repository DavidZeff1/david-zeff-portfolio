<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="David Zeff">
  <style>
    .plate { fill: #111111; }
    .mark  { fill: #fcfcfc; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #e9eaec; }
      .mark  { fill: #101215; }
    }
  </style>
  <rect class="plate" width="64" height="64" rx="13"/>
